<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeritageGo — Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/login&signupPage.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-page">

    <div class="auth-card">

      <!-- ========== LEFT: NAVY PANEL ========== -->
      <div class="auth-left">

        <p class="auth-logo">HeritageGO</p>

        <h1 class="auth-title">
          Welcome to the cradle
          of the First Philippine
          Republic.
        </h1>

        <p class="auth-sub">
          Log in to save landmarks, check in where you have been and share your ratings.
        </p>

        <div class="auth-graphic" aria-hidden="true">

          <div class="sun">
            <div class="sun-core"></div>
            <div class="sun-ray sun-ray--1"></div>
            <div class="sun-ray sun-ray--2"></div>
            <div class="sun-ray sun-ray--3"></div>
            <div class="sun-ray sun-ray--4"></div>
            <div class="sun-ray sun-ray--5"></div>
            <div class="sun-ray sun-ray--6"></div>
            <div class="sun-ray sun-ray--7"></div>
            <div class="sun-ray sun-ray--8"></div>
          </div>

          <div class="church">
            <div class="church-tower church-tower--left"></div>
            <div class="church-tower church-tower--right"></div>
            <div class="church-body"></div>
            <div class="church-door"></div>
            <div class="church-base"></div>
          </div>

        </div>

      </div>

      <!-- ========== RIGHT: FORM PANEL ========== -->
      <div class="auth-right">

        <div class="toggle-container">
          <button type="button" class="toggle-btn active" data-tab="login">Log in</button>
          <button type="button" class="toggle-btn" data-tab="signup">Sign up</button>
        </div>

        <form class="login-form" id="authForm" novalidate>

          <div class="input-wrap" id="nameWrap" style="display:none;">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" placeholder="Full name" class="input-field" id="nameField" autocomplete="name">
          </div>

          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2" ry="2"/>
                <polyline points="3 7 12 13 21 7"/>
              </svg>
            </span>
            <input type="email" placeholder="Email" class="input-field" id="emailField" autocomplete="email" required>
          </div>

          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" placeholder="Password" class="input-field" id="passwordField" autocomplete="current-password" required minlength="6">
          </div>

          <div class="input-wrap" id="confirmWrap" style="display:none;">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" placeholder="Confirm password" class="input-field" id="confirmField" autocomplete="new-password">
          </div>

          <p class="form-message" id="formMessage"></p>

          <button type="submit" class="btn-submit" id="submitBtn">Log in</button>
        </form>

        <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>

      </div>

       </div>

  </div>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-logo">HeritageGo</div>
      <p class="footer-text">
        2026 MitoDoesCode // https://github.com/MitoDoCode
        <br>
        2026 IdreDev // https://github.com/IdreDev
      </p>
    </div>
  </footer>

  <script src="../JS/login&signupPage.js"></script>
</body>
</html>
